name: Test ARCANA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: npm test
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-art.py
      - run: npm install --no-save playwright@1.56.1 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: node browser/smoke.mjs
        env:
          ARCANA_EXPECT_OPTIMIZED: '1'
      - name: Build optimized static site
        run: python scripts/build-site.py
      - name: Audit optimized release (accessibility and resource budgets)
        run: node browser/quality.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-visual-review
          path: browser/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcana-quality-report
          path: browser/quality/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-optimized-site
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/
  pages-source:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: read
      contents: read
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - name: Detect GitHub Pages source
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Pages source: $mode"
          if [ "$mode" != workflow ]; then
            echo "Select GitHub Actions in Settings > Pages to enable the optimized deployment."
          fi
  deploy:
    needs: [test, browser, pages-source]
    if: needs.pages-source.outputs.mode == 'workflow'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: arcana-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
