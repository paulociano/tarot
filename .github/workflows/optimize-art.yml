name: Prepare optimized ARCANA artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/cards/*.png', 'scripts/optimize-art.py', '.github/workflows/optimize-art.yml']
permissions:
  contents: read
jobs:
  optimize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/optimize-art.py
      - uses: actions/upload-artifact@v4
        with:
          name: arcana-optimized-artwork
          path: assets/optimized/
          if-no-files-found: error
