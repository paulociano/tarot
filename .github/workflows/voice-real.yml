name: Verify neural voice (real model)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node browser/voice-real.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: arcana-voice-sample
          path: browser/voice-sample.wav
